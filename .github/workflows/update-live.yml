name: Update live pixel page

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, so the sky follows the time of day
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the pixel page (sky, weather, streak, activity, contribution invaders)
        run: python scripts/generate_page.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          TZ_OFFSET_MIN: "330"   # India time (UTC+5:30). Change this if you want another timezone.

      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/page-light.svg assets/page-dark.svg
          git diff --cached --quiet || git commit -m "update live pixel page"
          git push
